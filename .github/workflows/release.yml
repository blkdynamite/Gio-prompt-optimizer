name: release

# Publishes a GitHub Release with notes taken from the matching section of
# CHANGELOG.md. Two ways to trigger it:
#   - push a v* tag, or
#   - run it manually (workflow_dispatch) with the tag to create; the tag is
#     then created on `main` by the release step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.4.0 (must match a CHANGELOG.md section)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag and extract release notes from CHANGELOG.md
        id: notes
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) echo "tag must start with v: $tag" >&2; exit 1;; esac
          ver="${tag#v}"
          awk -v v="$ver" '
            $0 ~ "^## " v " " { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $ver" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: main
          name: "Gio ${{ steps.notes.outputs.tag }}"
          body_path: notes.md
